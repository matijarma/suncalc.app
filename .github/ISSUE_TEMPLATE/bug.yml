name: Report a problem
description: A reproducible app, calculation or accessibility problem
body:
  - type: markdown
    attributes:
      value: "Please omit private locations, payment details and recovery codes. Use a public example pin."
  - type: textarea
    id: behavior
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps or a public example link
      description: For calculations, include the date, local time, time zone and reference you compared against.
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Device and browser
  - type: textarea
    id: details
    attributes:
      label: Additional details
